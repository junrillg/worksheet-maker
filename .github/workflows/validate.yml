name: Validate repository

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check packaging, links and assets
        run: python3 scripts/validate.py
      - name: Exercise updater with offline Git repositories
        run: python3 -m unittest discover -s tests -v
